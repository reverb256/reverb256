# Label-gated squash merge. This bootstrap PR needs one explicit owner merge:
# pull_request_target reads the workflow from the base branch, not this PR.
name: Merge when green
on:
  pull_request_target:
    types: [labeled, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["Tests", "Markdown lint", "Link check"]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read
concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true
jobs:
  merge:
    if: >-
      github.event_name == 'pull_request_target'
      || github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate and merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
        run: bash scripts/merge-when-green.sh
